[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-summarizer"
version = "0.1.0"
description = "A Signal bot that summarizes group and direct-message chats with the Claude API"
requires-python = ">=3.10"
# No required dependencies: the local backends use only the standard library,
# which keeps the install viable on a phone (Termux has no wheels for the
# Anthropic SDK's compiled dependencies).
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.69"]
dev = ["pytest>=8"]

[project.scripts]
signal-summarizer = "signal_summarizer.cli:main"

[tool.setuptools]
packages = ["signal_summarizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
